name: Feature request
description: Something the toolkit should be able to do and cannot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem / Задача
      description: >-
        What you were trying to do, and where the toolkit stopped being useful. Describe the
        situation rather than the solution — the fix is easier to judge against a real case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind / Как вы это видите
      description: Optional. If you already know the shape of the answer, say so.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead / Чем обходитесь сейчас
      description: The workaround, if there is one, and what it costs.
